services:
  - type: web
    name: agent-foundry
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn agent_foundry.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
    healthCheckPath: /health
